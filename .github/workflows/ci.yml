name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      SUPABASE_SECRET_KEY: placeholder
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BETTER_AUTH_SECRET: ci-build-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      SUPABASE_JWT_SECRET: ci-build-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:ja
      - run: npm run build

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - run: supabase start -x studio,mailpit,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > /dev/null
      - name: Configure local test credentials
        run: |
          umask 077
          supabase status -o json | jq -er '
            "NEXT_PUBLIC_SUPABASE_URL=" + .API_URL,
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" + .PUBLISHABLE_KEY,
            "SUPABASE_SECRET_KEY=" + .SECRET_KEY,
            "DATABASE_URL=" + .DB_URL,
            "SUPABASE_JWT_SECRET=" + .JWT_SECRET' > web/.env.local
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> web/.env.local
          echo 'BETTER_AUTH_URL=http://localhost:3127' >> web/.env.local
          echo 'MAIL_FROM=Ichido <no-reply@example.jp>' >> web/.env.local
          echo 'MAILPIT_URL=http://127.0.0.1:8025' >> web/.env.local
          echo 'DEVICE_SECRETS_JSON={"TABLE-A":"local-device-secret"}' >> web/.env.local
          # Alerts (tests/alerts.test.mjs): a local stub on 3199 stands in for push services, Expo and Better Stack.
          echo 'PUSH_ENDPOINT_ORIGINS=http://127.0.0.1:3199' >> web/.env.local
          echo 'EXPO_PUSH_URL=http://127.0.0.1:3199/expo/push' >> web/.env.local
          echo 'BETTERSTACK_HEARTBEATS_JSON={"TABLE-A":"http://127.0.0.1:3199/bs/TABLE-A"}' >> web/.env.local
          echo 'BETTERSTACK_UPTIME_ORIGIN=http://127.0.0.1:3199' >> web/.env.local
          echo "CRON_SECRET=$(openssl rand -hex 16)" >> web/.env.local
          # AI (tests/ai.test.mjs): tests/ai-stub.mjs on 3198 serves the OpenAI Responses and Gemini generateContent shapes.
          echo 'OPENAI_API_KEY=stub' >> web/.env.local
          echo 'OPENAI_BASE_URL=http://localhost:3198/v1' >> web/.env.local
          echo 'GEMINI_API_KEY=stub' >> web/.env.local
          echo 'GEMINI_BASE_URL=http://localhost:3198/v1beta' >> web/.env.local
          echo "AGENT_BRIDGE_SECRET=$(openssl rand -hex 32)" >> web/.env.local
      - run: npm ci
        working-directory: web
      - run: node scripts/vapid-keys.mjs >> .env.local
        working-directory: web
      - run: npm run seed:staff
        working-directory: web
      - name: Run web integration tests
        working-directory: web
        env:
          APP: http://localhost:3127
        run: |
          node tests/ai-stub.mjs > "$RUNNER_TEMP/ai-stub.log" 2>&1 &
          # The production build: what ships, with the strict CSP, and no dev-server live reload to disturb browser tests.
          npm run build > "$RUNNER_TEMP/ichido-build.log" 2>&1 || { tail -50 "$RUNNER_TEMP/ichido-build.log"; exit 1; }
          npx next start --hostname 127.0.0.1 --port 3127 > "$RUNNER_TEMP/ichido-dev.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 "$APP/api/health"
          node --env-file=.env.local scripts/wait-realtime.mjs supabase_db_ichido 180
          npm test
      - name: Show web log on failure
        if: failure()
        run: test ! -f "$RUNNER_TEMP/ichido-dev.log" || tail -100 "$RUNNER_TEMP/ichido-dev.log"
      - name: Show Realtime state on failure
        if: failure()
        run: |
          docker logs supabase_realtime_ichido 2>&1 | grep -viE "ping|billing" | tail -120
          docker exec supabase_db_ichido psql -U postgres -c "select slot_name, active from pg_replication_slots" \
            -c "select topic, event, private, inserted_at from realtime.messages order by inserted_at limit 15" \
            -c "select inhrelid::regclass from pg_inherits where inhparent = 'realtime.messages'::regclass"

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --locked
      - run: uv run python -m unittest

  firmware:
    runs-on: ubuntu-latest
    env:
      ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      ESP32_VERSION: 3.3.9
      WIFIMANAGER_VERSION: 2.0.17
      U8G2_VERSION: 2.36.19
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.6.0
      - uses: actions/cache@v4
        id: cores
        with:
          path: |
            ~/.arduino15/packages
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ runner.arch }}-esp32-${{ env.ESP32_VERSION }}-wifi-${{ env.WIFIMANAGER_VERSION }}-u8g2-${{ env.U8G2_VERSION }}
      - run: arduino-cli core update-index
      - if: steps.cores.outputs.cache-hit != 'true'
        run: |
          arduino-cli core install "esp32:esp32@$ESP32_VERSION"
          arduino-cli lib install "WiFiManager@$WIFIMANAGER_VERSION" "U8g2@$U8G2_VERSION"
      - run: |
          cp firmware/help_point/secrets.example.h firmware/help_point/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/help_point

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
